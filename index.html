<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vertex AI: Fake News Detection</title>

<script src="https://cdn.tailwindcss.com"></script>

<!-- ✅ Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXqWhgcJISqsruhsK-pTzOZfqYhUW55gk",
  authDomain: "vertex-ai-c96eb.firebaseapp.com",
  projectId: "vertex-ai-c96eb",
  storageBucket: "vertex-ai-c96eb.firebasestorage.app",
  messagingSenderId: "785987748963",
  appId: "1:785987748963:web:0508f3e8c650bf5b622456",
  measurementId: "G-69HWT1KK0M"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Make global
window.firebaseAuth = auth;
window.firebaseFns = {
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
};
</script>

<style>
body { font-family: 'Inter', sans-serif; }
.hidden { display:none; }
</style>
</head>

<body class="bg-gray-900 text-white">

<!-- ================= UI SAME AS YOURS ================= -->
<div id="auth-section" class="flex items-center justify-center min-h-screen">
  <div id="login-form-container"></div>
  <div id="register-form-container" class="hidden"></div>
</div>

<div id="main-app" class="hidden">
  <button id="logout-btn">Logout</button>

  <input id="url-input" placeholder="Enter URL" class="text-black"/>
  <button id="analyze-btn">Analyze</button>

  <div id="results-container"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {

let state = {
  isLoggedIn: false,
  isLoginView: true,
  result:null
};

const authSection = document.getElementById('auth-section');
const mainApp = document.getElementById('main-app');
const loginFormContainer = document.getElementById('login-form-container');
const registerFormContainer = document.getElementById('register-form-container');
const logoutBtn = document.getElementById('logout-btn');

const loginTemplate = `
<div>
  <h2>Login</h2>
  <input id="login-email" placeholder="Email"/>
  <input id="login-password" type="password" placeholder="Password"/>
  <button id="login-submit">Login</button>
  <button id="show-register">Register</button>
</div>`;

const registerTemplate = `
<div>
  <h2>Register</h2>
  <input id="register-email" placeholder="Email"/>
  <input id="register-password" type="password" placeholder="Password"/>
  <button id="register-submit">Create Account</button>
  <button id="show-login">Login</button>
</div>`;

function render(){
  if(state.isLoggedIn){
    authSection.classList.add('hidden');
    mainApp.classList.remove('hidden');
  }else{
    authSection.classList.remove('hidden');
    mainApp.classList.add('hidden');

    if(state.isLoginView){
      loginFormContainer.innerHTML = loginTemplate;
      registerFormContainer.classList.add('hidden');
      loginFormContainer.classList.remove('hidden');
    }else{
      registerFormContainer.innerHTML = registerTemplate;
      loginFormContainer.classList.add('hidden');
      registerFormContainer.classList.remove('hidden');
    }
    addAuthListeners();
  }
}

function addAuthListeners(){

document.getElementById('show-register')?.addEventListener('click',()=>{
  state.isLoginView=false;
  render();
});

document.getElementById('show-login')?.addEventListener('click',()=>{
  state.isLoginView=true;
  render();
});

document.getElementById('login-submit')?.addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  try{
    await window.firebaseFns.signInWithEmailAndPassword(window.firebaseAuth,email,password);
    state.isLoggedIn = true;
    render();
  }catch(err){
    alert(err.message);
  }
});

document.getElementById('register-submit')?.addEventListener('click', async ()=>{
  const email = document.getElementById('register-email').value;
  const password = document.getElementById('register-password').value;

  try{
    await window.firebaseFns.createUserWithEmailAndPassword(window.firebaseAuth,email,password);
    state.isLoggedIn = true;
    render();
  }catch(err){
    alert(err.message);
  }
});
}

// logout
logoutBtn.addEventListener('click', async ()=>{
  await window.firebaseFns.signOut(window.firebaseAuth);
  state.isLoggedIn=false;
  render();
});

// keep session
window.firebaseFns.onAuthStateChanged(window.firebaseAuth,(user)=>{
  if(user){
    state.isLoggedIn=true;
  }else{
    state.isLoggedIn=false;
  }
  render();
});


// ================= GEMINI (same as yours) =================
async function analyzeContent(){
  const url = document.getElementById('url-input').value;

  const apiKey = "AIzaSyAJZmtyKuK3oLFuIniioeD7aIyk81TbihI"; // your Gemini key

  const response = await fetch(
    "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key="+apiKey,
    {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        contents:[{
          parts:[{text:"Analyze news: "+url}]
        }]
      })
    }
  );

  const data = await response.json();
  document.getElementById('results-container').innerText =
    data?.candidates?.[0]?.content?.parts?.[0]?.text || "Error";
}

document.getElementById('analyze-btn').addEventListener('click', analyzeContent);

render();

});
</script>

</body>
</html>
